name: SigV4 Session Name Regression
on:
  push:
    branches:
      - fix/sigv4-assume-role-session-name
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sigv4-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension/sigv4authextension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: extension/sigv4authextension/go.mod
          cache: false
      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l extension.go extension_test.go)"
      - name: Run focused STS session-name regression tests
        run: go test -count=1 -run '^TestAssumeRoleOptions' .
      - name: Run extension package tests
        run: go test -count=1 ./...
      - name: Race-check focused regression tests
        run: go test -race -count=1 -run '^TestAssumeRoleOptions' .
